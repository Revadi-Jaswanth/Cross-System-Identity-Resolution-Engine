version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: identity_resolution_db
    restart: always
    environment:
      MYSQL_DATABASE: identity_resolution
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: identity_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ../database/seeds.sql:/docker-entrypoint-initdb.d/seeds.sql
    networks:
      - resolution_network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: identity_resolution_backend
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://identity_user:userpassword@database:3306/identity_resolution
      JWT_SECRET_KEY: change_this_to_a_robust_production_key
      PEPPER_SECRET: change_this_to_a_robust_production_pepper
    ports:
      - "5000:5000"
    depends_on:
      - database
    networks:
      - resolution_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: identity_resolution_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resolution_network

networks:
  resolution_network:
    driver: bridge

volumes:
  db_data:
